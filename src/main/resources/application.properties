spring.application.name=school-management
spring.profiles.default=dev

server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.connection-timeout=10s
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/csv
server.error.include-stacktrace=never

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:school}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.paths-to-match=/api/**

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
info.app.name=School Management System
info.app.version=@project.version@

app.monitoring.metrics-username=${METRICS_USERNAME:}
app.monitoring.metrics-password=${METRICS_PASSWORD:}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=school-management
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
app.security.max-failed-logins=5
app.security.lock-duration=15m
app.security.refresh-reuse-grace=10s
app.security.cookie-secure=${COOKIE_SECURE:true}
app.security.bcrypt-cost=${BCRYPT_COST:12}

app.school.name=${SCHOOL_NAME:Greenfield High School}
app.school.time-zone=${SCHOOL_TIME_ZONE:Asia/Dhaka}
app.grading.strategy=${GRADING_STRATEGY:GPA_5}
app.attendance.low-threshold-percent=75

app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.demo-password=${DEMO_PASSWORD:}
