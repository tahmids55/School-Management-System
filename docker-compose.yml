services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required. Copy .env.example to .env and set your values.}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env and set your values.}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-school}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required. Copy .env.example to .env and set your values.}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required. Copy .env.example to .env and set your values.}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required. Copy .env.example to .env and replace the placeholder.}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required. Copy .env.example to .env and set your values.}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?DEMO_PASSWORD is required. Copy .env.example to .env and set your values.}
      COOKIE_SECURE: "false"
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      METRICS_USERNAME: ${METRICS_USERNAME:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_username
      - metrics_password

  grafana:
    image: grafana/grafana:11.6.0
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

secrets:
  metrics_username:
    environment: METRICS_USERNAME
  metrics_password:
    environment: METRICS_PASSWORD

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
